<!DOCTYPE html>
<html>
<head>
    <title>Garbsen CityPost Router</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
    <script src="https://unpkg.com/maplibre-gl@3.0.0/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.0.0/dist/maplibre-gl.css" rel="stylesheet" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
        #ui { position: absolute; top: 10px; left: 10px; right: 10px; background: rgba(255,255,255,0.9); padding: 10px; border-radius: 8px; z-index: 1; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        textarea { width: 95%; height: 50px; margin-bottom: 5px; font-size: 14px; }
        button { background: #28a745; color: white; border: none; padding: 10px; border-radius: 5px; width: 100%; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div id="ui">
    <textarea id="addressInput" placeholder="Lübeckerstr 3&#10;Beethovenstr 6&#10;Rote Reihe 19"></textarea>
    <button onclick="startRouting()">Show Bike Route</button>
</div>
<div id="map"></div>

<script>
    // --- INSERT YOUR KEYS HERE ---
    const MAPTILER_KEY = 'YOUR_MAPTILER_KEY'; 
    const ORS_KEY = 'YOUR_ORS_KEY'; 

    const map = new maplibregl.Map({
        container: 'map',
        style: `https://api.maptiler.com/maps/streets-v2/style.json?key=${MAPTILER_KEY}`,
        center: [9.6105, 52.4187], // Berenbostel
        zoom: 14
    });

    // Tracking your live location
    map.addControl(new maplibregl.GeolocateControl({
        positionOptions: { enableHighAccuracy: true },
        trackUserLocation: true
    }));

    async function startRouting() {
        const lines = document.getElementById('addressInput').value.split('\n').filter(l => l.trim().length > 0);
        const coordinates = [];

        for (let addr of lines) {
            // We add "Garbsen" automatically so it finds the right 30827 streets
            const url = `https://api.openrouteservice.org/geocode/search?api_key=${ORS_KEY}&text=${encodeURIComponent(addr + ", Garbsen")}&size=1`;
            const resp = await fetch(url);
            const data = await resp.json();
            
            if (data.features && data.features.length > 0) {
                const coord = data.features[0].geometry.coordinates;
                coordinates.push(coord);
                // Drop a marker for each house
                new maplibregl.Marker().setLngLat(coord).setPopup(new maplibregl.Popup().setHTML(addr)).addTo(map);
            }
        }

        if (coordinates.length > 1) {
            getOptimizedRoute(coordinates);
        }
    }

    async function getOptimizedRoute(coords) {
        // This tells the engine: "I'm on a bike, give me the best path"
        const body = { "coordinates": coords, "profile": "cycling-regular" };
        const resp = await fetch(`https://api.openrouteservice.org/v2/directions/cycling-regular/geojson`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': ORS_KEY },
            body: JSON.stringify(body)
        });
        
        const data = await resp.json();
        
        if (map.getSource('route')) {
            map.getSource('route').setData(data);
        } else {
            map.addSource('route', { type: 'geojson', data: data });
            map.addLayer({
                id: 'route',
                type: 'line',
                source: 'route',
                layout: { 'line-join': 'round', 'line-cap': 'round' },
                paint: { 'line-color': '#007bff', 'line-width': 5 }
            });
        }

        // Zoom map to fit the whole route
        const bounds = new maplibregl.LngLatBounds();
        coords.forEach(c => bounds.extend(c));
        map.fitBounds(bounds, { padding: 50 });
    }
</script>
</body>
</html>
