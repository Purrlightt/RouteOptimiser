<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CityPost Turbo Optimizer</title>
    
    <script src="config.js"></script>
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />

    <style>
        :root { --neon: #00f2ff; --purple: #7000ff; --danger: #ff4444; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; }
        #app-wrapper { display: flex; flex-direction: column; height: 100vh; width: 100vw; }
        #map { flex: 1; width: 100%; z-index: 1; }
        #ui-panel {
            height: 45%; background: #0f0f0f; border-top: 2px solid var(--neon);
            display: flex; flex-direction: column; padding: 12px; z-index: 99999;
            box-sizing: border-box;
        }
        .status-bar { font-size: 11px; color: var(--neon); margin-bottom: 8px; font-weight: 800; text-transform: uppercase; }
        .input-row { display: flex; gap: 8px; margin-bottom: 10px; }
        input { flex: 2; background: #1a1a1a; color: #fff; border: 1px solid #333; padding: 12px; border-radius: 10px; font-size: 16px; outline: none; }
        select { flex: 1; background: #222; color: var(--neon); border: 1px solid #333; border-radius: 10px; }
        .queue-list { flex: 1; overflow-y: auto; background: #000; border-radius: 10px; border: 1px solid #222; margin-bottom: 10px; }
        .queue-item { display: flex; justify-content: space-between; padding: 12px; border-bottom: 1px solid #222; color: #ffffff !important; font-size: 14px; }
        .action-row { display: flex; gap: 8px; }
        button { padding: 14px; border: none; border-radius: 10px; font-weight: 800; cursor: pointer; text-transform: uppercase; font-size: 11px; }
        .btn-add { background: var(--neon); color: #000; }
        .btn-clear { background: #300; color: #f88; }
        .btn-route { flex: 2; background: linear-gradient(90deg, var(--neon), var(--purple)); color: #fff; }
        .house-marker { width: 30px; height: 30px; background: #000; border: 2px solid var(--neon); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--neon); font-weight: 900; }
    </style>
</head>
<body>

<div id="app-wrapper">
    <div id="map"></div>
    <div id="ui-panel">
        <div id="status" class="status-bar">GPS: Initializing...</div>
        <div class="input-row">
            <input type="text" id="streetInput" placeholder="Strasse + Nr">
            <select id="plzSelect">
                <option value="30823">30823</option>
                <option value="30826">30826</option>
                <option value="30827">30827</option>
            </select>
            <button class="btn-add" onclick="addStop()">ADD</button>
        </div>
        <div id="addressQueue" class="queue-list"></div>
        <div class="action-row">
            <button class="btn-clear" onclick="clearAll()">Clear</button>
            <button class="btn-route" onclick="optimizeAndRoute()">OPTIMIZE & START</button>
        </div>
    </div>
</div>

<script>
    const T_KEY = CONFIG.MAPTILER_KEY;
    const O_KEY = CONFIG.ORS_KEY;
    let userLoc = null, queue = [], markers = [];

    const map = new maplibregl.Map({
        container: 'map',
        style: `https://api.maptiler.com/maps/streets-v2-dark/style.json?key=${T_KEY}`,
        center: [9.617, 52.415], zoom: 15
    });

    const geolocate = new maplibregl.GeolocateControl({
        positionOptions: { enableHighAccuracy: true },
        trackUserLocation: true, showUserHeading: true
    });
    map.addControl(geolocate);

    geolocate.on('geolocate', (e) => {
        userLoc = [e.coords.longitude, e.coords.latitude];
        document.getElementById('status').innerText = "GPS: Locked | System Ready";
        document.getElementById('status').style.color = "#00ff00";
    });

    async function addStop() {
        const street = document.getElementById('streetInput').value.trim();
        const plz = document.getElementById('plzSelect').value;
        if (!street) return;

        document.getElementById('status').innerText = "Locating...";
        const query = encodeURIComponent(`${street}, ${plz} Garbsen, Germany`);
        const url = `https://api.maptiler.com/geocoding/${query}.json?key=${T_KEY}&limit=1&bbox=9.58,52.39,9.65,52.44`;

        try {
            const r = await fetch(url);
            const d = await r.json();
            if (d.features && d.features.length > 0) {
                const pt = d.features[0].center;
                const id = Date.now();
                queue.push({ street, plz, coords: pt, id });
                updateUI();
                document.getElementById('streetInput').value = "";
                document.getElementById('status').innerText = "Added: " + street;
                
                // Drop pin
                const el = document.createElement('div');
                el.className = 'house-marker';
                el.innerHTML = queue.length;
                const m = new maplibregl.Marker(el).setLngLat(pt).addTo(map);
                markers.push({ id, marker: m });
            } else {
                document.getElementById('status').innerText = "Not found!";
            }
        } catch (e) { document.getElementById('status').innerText = "Search Error"; }
    }

    function updateUI() {
        document.getElementById('addressQueue').innerHTML = queue.map((item, i) => `
            <div class="queue-item">
                <span><b>${item.plz}</b> ${item.street}</span>
                <span onclick="removeStop(${item.id})" style="color:var(--danger); cursor:pointer;">X</span>
            </div>
        `).join('');
    }

    function removeStop(id) {
        const qIdx = queue.findIndex(q => q.id === id);
        if (qIdx > -1) {
            queue.splice(qIdx, 1);
            const mIdx = markers.findIndex(m => m.id === id);
            if (mIdx > -1) { markers[mIdx].marker.remove(); markers.splice(mIdx, 1); }
            updateUI();
        }
    }

    function clearAll() {
        queue = []; markers.forEach(m => m.marker.remove()); markers = [];
        if (map.getSource('route')) map.getSource('route').setData({type:'FeatureCollection', features:[]});
        updateUI();
        document.getElementById('status').innerText = "Cleared";
    }

    async function optimizeAndRoute() {
        if (!userLoc || queue.length === 0) return alert("Wait for GPS and add stops!");
        document.getElementById('status').innerText = "Optimizing Route...";

        const jobs = queue.map((item, index) => ({ id: index, location: item.coords }));
        
        try {
            // STEP 1: Optimization (TSP)
            const optResp = await fetch(`https://api.openrouteservice.org/optimization`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': O_KEY },
                body: JSON.stringify({
                    jobs: jobs,
                    vehicles: [{ id: 0, profile: "cycling-regular", start: userLoc }]
                })
            });
            const optData = await optResp.json();
            
            // Extract the optimized coordinates in order
            const steps = optData.routes[0].steps;
            const optimizedCoords = steps.map(s => s.location);

            // STEP 2: Draw the line
            const routeResp = await fetch(`https://api.openrouteservice.org/v2/directions/cycling-regular/geojson`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': O_KEY },
                body: JSON.stringify({ coordinates: optimizedCoords })
            });
            const routeData = await routeResp.json();

            if (map.getSource('route')) map.getSource('route').setData(routeData);
            else {
                map.addSource('route', { type: 'geojson', data: routeData });
                map.addLayer({ id: 'route', type: 'line', source: 'route', paint: { 'line-color': '#00f2ff', 'line-width': 6 } });
            }

            const bounds = new maplibregl.LngLatBounds();
            optimizedCoords.forEach(p => bounds.extend(p));
            map.fitBounds(bounds, { padding: 50 });
            document.getElementById('status').innerText = "Optimized Route Active!";
        } catch (e) { 
            alert("Routing Error: Check API Key/Network");
            document.getElementById('status').innerText = "Error"; 
        }
    }

    map.on('load', () => { geolocate.trigger(); map.resize(); });
</script>
</body>
</html>
