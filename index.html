<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CityPost Ultra</title>
    <link rel="stylesheet" href="style.css">
    <script src="config.js"></script>
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
</head>
<body>

<div id="map"></div>

<div id="ui-deck">
    <div class="cyber-card">
        <textarea id="addressInput" placeholder="Stops..."></textarea>
        <div class="btn-row">
            <button class="btn-sat" onclick="toggleSatellite()">SAT</button>
            <button class="btn-main" onclick="startEngine()">ROUTE</button>
        </div>
    </div>
</div>

<script>
    const T_KEY = CONFIG.MAPTILER_KEY;
    const O_KEY = CONFIG.ORS_KEY;
    let userLoc = null;
    let markers = [];

    const map = new maplibregl.Map({
        container: 'map',
        style: `https://api.maptiler.com/maps/streets-v2-dark/style.json?key=${T_KEY}`,
        center: [9.617, 52.415], zoom: 15, attributionControl: false
    });

    const geolocate = new maplibregl.GeolocateControl({
        positionOptions: { enableHighAccuracy: true },
        trackUserLocation: true, showUserHeading: true
    });
    map.addControl(geolocate, 'top-right');
    geolocate.on('geolocate', (e) => { userLoc = [e.coords.longitude, e.coords.latitude]; });

    async function startEngine() {
        const lines = document.getElementById('addressInput').value.split('\n').filter(l => l.trim().length > 0);
        let coords = [];
        markers.forEach(m => m.remove()); markers = [];

        // Geocoding each address
        for (let line of lines) {
            // SPECIFIC FIX for Lübecker Str 3
            let queryText = line + ', Garbsen, Germany';
            if(line.toLowerCase().includes("lübecker")) queryText = line + ', Alt-Garbsen, Germany';

            const url = `https://api.maptiler.com/geocoding/${encodeURIComponent(queryText)}.json?key=${T_KEY}&limit=1`;
            
            try {
                const r = await fetch(url);
                const d = await r.json();
                if (d.features && d.features.length > 0) {
                    const pt = d.features[0].center;
                    coords.push(pt);
                    const el = document.createElement('div');
                    el.className = 'house-marker';
                    el.innerHTML = `<span>${coords.length}</span>`;
                    const m = new maplibregl.Marker(el).setLngLat(pt).addTo(map);
                    markers.push(m);
                }
            } catch (e) { console.error("Error finding house"); }
        }

        if (coords.length > 1) {
            // Always try to start the route from where you are standing
            const finalPath = userLoc ? [userLoc, ...coords] : coords;
            drawRoute(finalPath);
        }
    }

    async function drawRoute(coordinates) {
        const url = `https://api.openrouteservice.org/v2/directions/cycling-regular/geojson`;
        try {
            const resp = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': O_KEY },
                body: JSON.stringify({ coordinates: coordinates })
            });
            const data = await resp.json();
            
            if (map.getSource('route')) {
                map.getSource('route').setData(data);
            } else {
                map.addSource('route', { type: 'geojson', data: data });
                map.addLayer({
                    id: 'route', type: 'line', source: 'route',
                    paint: { 'line-color': '#00f2ff', 'line-width': 5 }
                });
            }
            const bounds = new maplibregl.LngLatBounds();
            coordinates.forEach(c => bounds.extend(c));
            map.fitBounds(bounds, { padding: 60 });
        } catch (e) { console.log("Routing error"); }
    }

    function toggleSatellite() {
        const isSat = map.getStyle().name === 'Satellite';
        map.setStyle(isSat 
            ? `https://api.maptiler.com/maps/streets-v2-dark/style.json?key=${T_KEY}`
            : `https://api.maptiler.com/maps/hybrid/style.json?key=${T_KEY}`);
    }

    map.on('load', () => { 
        geolocate.trigger(); 
        map.resize(); 
    });
</script>
</body>
</html>
