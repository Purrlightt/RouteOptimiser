<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CityPost 308xx Pro</title>
    <link rel="stylesheet" href="style.css">
    <script src="config.js"></script>
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
</head>
<body>

<div id="map"></div>

<div id="ui-panel">
    <div class="input-row">
        <input type="text" id="streetInput" placeholder="Lübecker Straße 3">
        <select id="plzSelect">
            <option value="30823">30823</option>
            <option value="30826">30826</option>
            <option value="30827">30827</option>
        </select>
        <button class="btn-add" onclick="addToQueue()">ADD</button>
    </div>

    <div id="addressQueue" class="queue-container"></div>

    <div class="action-row">
        <button class="btn-clear" onclick="clearQueue()">Clear All</button>
        <button class="btn-route" onclick="generateRoute()">Start Optimal Route</button>
    </div>
</div>

<script>
    const T_KEY = CONFIG.MAPTILER_KEY;
    const O_KEY = CONFIG.ORS_KEY;
    let userLoc = null;
    let queue = [];
    let markers = [];

    const map = new maplibregl.Map({
        container: 'map',
        style: `https://api.maptiler.com/maps/streets-v2-dark/style.json?key=${T_KEY}`,
        center: [9.617, 52.415], zoom: 15
    });

    const geolocate = new maplibregl.GeolocateControl({
        positionOptions: { enableHighAccuracy: true },
        trackUserLocation: true
    });
    map.addControl(geolocate, 'top-right');
    geolocate.on('geolocate', (e) => { userLoc = [e.coords.longitude, e.coords.latitude]; });

    function addToQueue() {
        const street = document.getElementById('streetInput').value.trim();
        const plz = document.getElementById('plzSelect').value;
        if (!street) return;
        queue.push({ street, plz });
        updateUI();
        document.getElementById('streetInput').value = "";
    }

    function clearQueue() {
        queue = [];
        updateUI();
        markers.forEach(m => m.remove());
        if (map.getSource('route')) map.getSource('route').setData({type: 'FeatureCollection', features: []});
    }

    function updateUI() {
        const list = document.getElementById('addressQueue');
        list.innerHTML = queue.map((item, i) => `
            <div class="queue-item">
                <span><b>${item.plz}</b> ${item.street}</span>
                <span style="color:#ff4444;" onclick="removeItem(${i})">X</span>
            </div>
        `).join('');
    }

    function removeItem(i) {
        queue.splice(i, 1);
        updateUI();
    }

    async function generateRoute() {
        if (queue.length === 0) return;
        let coords = [];
        markers.forEach(m => m.remove());

        for (let item of queue) {
            const query = encodeURIComponent(`${item.street}, ${item.plz} Garbsen, Germany`);
            const url = `https://api.maptiler.com/geocoding/${query}.json?key=${T_KEY}&limit=1`;
            try {
                const r = await fetch(url);
                const d = await r.json();
                if (d.features && d.features.length > 0) {
                    const pt = d.features[0].center;
                    coords.push(pt);
                    const el = document.createElement('div');
                    el.style.width = '18px'; el.style.height = '18px'; el.style.background = '#00f2ff'; 
                    el.style.borderRadius = '50%'; el.style.border = '2px solid white';
                    markers.push(new maplibregl.Marker(el).setLngLat(pt).addTo(map));
                }
            } catch (e) { console.error(e); }
        }

        if (coords.length > 0) {
            const path = userLoc ? [userLoc, ...coords] : coords;
            const url = `https://api.openrouteservice.org/v2/directions/cycling-regular/geojson`;
            const resp = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': O_KEY },
                body: JSON.stringify({ coordinates: path })
            });
            const data = await resp.json();
            if (map.getSource('route')) map.getSource('route').setData(data);
            else {
                map.addSource('route', { type: 'geojson', data: data });
                map.addLayer({ id: 'route', type: 'line', source: 'route', paint: { 'line-color': '#00f2ff', 'line-width': 5 } });
            }
            const bounds = new maplibregl.LngLatBounds();
            path.forEach(c => bounds.extend(c));
            map.fitBounds(bounds, { padding: 50 });
        }
    }

    map.on('load', () => { 
        geolocate.trigger();
        map.resize(); 
    });
</script>
</body>
</html>
