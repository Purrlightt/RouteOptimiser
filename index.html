<!DOCTYPE html>
<html>

<head>
    <title>CityPost Pro - Garbsen</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
    <script src="https://unpkg.com/maplibre-gl@3.0.0/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.0.0/dist/maplibre-gl.css" rel="stylesheet" />
    <style>
        :root {
            --blue: #007bff;
            --red: #ff3b30;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, sans-serif;
            background: #000;
            color: white;
        }

        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
        }

        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            background: rgba(20, 20, 20, 0.95);
            padding: 15px;
            border-radius: 15px;
            z-index: 10;
            border: 1px solid #444;
        }

        textarea {
            width: 100%;
            height: 80px;
            background: #333;
            color: white;
            border: 1px solid #555;
            border-radius: 8px;
            padding: 10px;
            font-size: 16px;
            box-sizing: border-box;
        }

        button {
            background: var(--blue);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 8px;
            width: 100%;
            font-weight: bold;
            font-size: 16px;
            margin-top: 10px;
        }

        #status {
            font-size: 11px;
            color: #aaa;
            margin-bottom: 5px;
            font-family: monospace;
        }

        .house-marker {
            background: var(--red);
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 3px solid white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>

<body>

    <div id="ui">
        <div id="status">30827 / 30823 READY</div>
        <textarea id="addressInput" placeholder="Lübeckerstr 3&#10;Beethovenstr 6&#10;Rote Reihe 19"></textarea>
        <button onclick="startDelivery()">GENERATE POSTAL ROUTE</button>
    </div>
    <div id="map"></div>

    <script>
        const MAPTILER_KEY = 'CcM6ytJu15GKv69XcBwC';
        const ORS_KEY = 'eyJvcmciOiI1YjNjZTM1OTc4NTExMTAwMDFjZjYyNDgiLCJpZCI6IjMzNWI2ZDBlMTk3YzRhZTZiNzkwZTQwYmEwNDhlOTM5IiwiaCI6Im11cm11cjY0In0=';

        const map = new maplibregl.Map({
            container: 'map',
            style: `https://api.maptiler.com/maps/streets-v2-dark/style.json?key=${KEY}`,
            center: [9.6105, 52.4187],
            zoom: 16,
            pitch: 45
        });

        const geolocate = new maplibregl.GeolocateControl({
            positionOptions: { enableHighAccuracy: true },
            trackUserLocation: true,
            showUserHeading: true
        });
        map.addControl(geolocate);

        let currentMarkers = [];

        async function startDelivery() {
            const lines = document.getElementById('addressInput').value.split('\n').filter(l => l.trim().length > 0);
            const coordinates = [];
            const status = document.getElementById('status');

            // Clear old pins
            currentMarkers.forEach(m => m.remove());
            currentMarkers = [];

            for (let rawLine of lines) {
                status.innerText = "Targeting House: " + rawLine;

                // WE SPLIT THE ADDRESS FOR MAX PRECISION
                const parts = rawLine.trim().split(' ');
                const number = parts.pop(); // Take the last word (the house number)
                const street = parts.join(' '); // Everything else is the street

                // MapTiler Geocoding is faster and has better German house data
                const url = `https://api.maptiler.com/geocoding/${encodeURIComponent(street + ' ' + number + ', Garbsen')}.json?key=${KEY}&bbox=9.55,52.38,9.75,52.46&fuzzy=false`;

                try {
                    const resp = await fetch(url);
                    const data = await resp.json();

                    if (data.features && data.features.length > 0) {
                        // We look for the result that has 'house' or 'address' accuracy
                        const bestResult = data.features[0];
                        const coord = bestResult.center;
                        coordinates.push(coord);

                        const el = document.createElement('div');
                        el.className = 'house-marker';
                        el.innerText = number;

                        const marker = new maplibregl.Marker(el).setLngLat(coord).addTo(map);
                        currentMarkers.push(marker);
                    }
                } catch (e) { console.error(e); }
            }

            if (coordinates.length > 0) {
                status.innerText = "Route Locked.";
                drawBikePath(coordinates);
                geolocate.trigger(); // This turns on the "Blue Dot" instantly
            }
        }

        async function drawBikePath(coords) {
            // We use ORS for the actual "Bike Line" calculation
            const body = { "coordinates": coords, "instructions": false };
            const url = `https://api.openrouteservice.org/v2/directions/cycling-regular/geojson`;

            const resp = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': ORS_KEY },
                body: JSON.stringify(body)
            });

            const data = await resp.json();
            if (map.getSource('route')) {
                map.getSource('route').setData(data);
            } else {
                map.addSource('route', { type: 'geojson', data: data });
                map.addLayer({
                    id: 'route',
                    type: 'line',
                    source: 'route',
                    paint: { 'line-color': '#007bff', 'line-width': 4 }
                });
            }

            const bounds = new maplibregl.LngLatBounds();
            coords.forEach(c => bounds.extend(c));
            map.fitBounds(bounds, { padding: 120 });
        }
    </script>
</body>

</html>
