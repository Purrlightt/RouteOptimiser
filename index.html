<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CityPost Turbo</title>
    <link rel="stylesheet" href="style.css">
    <script src="config.js"></script>
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
</head>
<body>
    <div id="app-container">
        <div id="map"></div>
        <div id="ui-panel">
            <div class="input-group">
                <input type="text" id="streetInput" placeholder="Lübecker Straße 3">
                <select id="plzSelect">
                    <option value="30823">30823</option>
                    <option value="30826">30826</option>
                    <option value="30827">30827</option>
                </select>
                <button class="btn-add" onclick="addToQueue()">ADD</button>
            </div>
            <div id="addressQueue" class="queue-list"></div>
            <div class="btn-row">
                <button class="btn-clear" onclick="queue=[];renderUI();">Clear</button>
                <button class="btn-go" onclick="startOptimalRoute()">Optimize & Start</button>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
