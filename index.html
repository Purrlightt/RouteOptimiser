<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CityPost Pro | Garbsen</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
</head>

<body>

    <div id="ui-container">
        <div class="glass-panel">
            <textarea id="addressInput" placeholder="Lübeckerstr 3&#10;Beethovenstr 6&#10;Rote Reihe 19"></textarea>
            <div class="btn-group">
                <button class="btn-main" onclick="startDelivery()">Optimize Route</button>
                <button class="btn-secondary" onclick="location.reload()">Clear</button>
            </div>
        </div>
    </div>

    <div id="map"></div>

    <script>
        // --- INSERT YOUR API KEYS HERE ---
        const MAPTILER_KEY = 'CcM6ytJu15GKv69XcBwC';
        const ORS_KEY = 'eyJvcmciOiI1YjNjZTM1OTc4NTExMTAwMDFjZjYyNDgiLCJpZCI6IjMzNWI2ZDBlMTk3YzRhZTZiNzkwZTQwYmEwNDhlOTM5IiwiaCI6Im11cm11cjY0In0=';

        // Initialize Map with error catching
        const map = new maplibregl.Map({
            container: 'map',
            style: `https://api.maptiler.com/maps/streets-v2-dark/style.json?key=${TILER_KEY}`,
            center: [9.598, 52.428], // Central Garbsen
            zoom: 13,
            antialias: true
        });

        // Add High-Precision GPS
        const geolocate = new maplibregl.GeolocateControl({
            positionOptions: { enableHighAccuracy: true },
            trackUserLocation: true,
            showUserHeading: true
        });
        map.addControl(geolocate, 'bottom-right');

        let markers = [];

        async function startDelivery() {
            const input = document.getElementById('addressInput').value;
            const lines = input.split('\n').filter(l => l.trim().length > 0);
            const coords = [];

            // Remove old pins
            markers.forEach(m => m.remove());
            markers = [];

            for (let line of lines) {
                // Geocoding with a focus on Garbsen 308xx
                const url = `https://api.maptiler.com/geocoding/${encodeURIComponent(line + ', Garbsen, Germany')}.json?key=${TILER_KEY}&fuzzy=false`;

                try {
                    const resp = await fetch(url);
                    const data = await resp.json();

                    if (data.features && data.features.length > 0) {
                        const feature = data.features[0];
                        const pt = feature.center;
                        coords.push(pt);

                        // Marker UI
                        const el = document.createElement('div');
                        el.className = 'house-marker';
                        el.innerText = line.match(/\d+/) || '!';

                        const m = new maplibregl.Marker(el).setLngLat(pt).addTo(map);

                        // Tap to Finish Logic
                        el.onclick = () => { if (confirm("Delivered to " + line + "?")) m.remove(); };
                        markers.push(m);
                    }
                } catch (e) { console.error("Geocode Error:", e); }
            }

            if (coords.length > 0) {
                if (coords.length > 1) drawPath(coords);
                geolocate.trigger();

                // Auto-zoom to fit all addresses
                const bounds = new maplibregl.LngLatBounds();
                coords.forEach(c => bounds.extend(c));
                map.fitBounds(bounds, { padding: 80 });
            }
        }

        async function drawPath(coords) {
            const url = `https://api.openrouteservice.org/v2/directions/cycling-regular/geojson`;
            try {
                const resp = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': ORS_KEY },
                    body: JSON.stringify({ "coordinates": coords })
                });
                const data = await resp.json();

                if (map.getSource('route')) {
                    map.getSource('route').setData(data);
                } else {
                    map.addSource('route', { type: 'geojson', data: data });
                    map.addLayer({
                        id: 'route',
                        type: 'line',
                        source: 'route',
                        layout: { 'line-join': 'round', 'line-cap': 'round' },
                        paint: { 'line-color': '#ffcc00', 'line-width': 6, 'line-opacity': 0.8 }
                    });
                }
            } catch (e) { console.error("Routing Error:", e); }
        }

        // Ensure map resizes correctly if window changes
        map.on('load', () => {
            map.resize();
        });
    </script>

</body>

</html>
