<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CityPost SpeedSync</title>
    <link rel="stylesheet" href="style.css">
    <script src="config.js"></script>
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
</head>
<body>

<div id="map"></div>
<div id="ui-wrapper">
    <div class="cyber-card">
        <textarea id="addressInput" placeholder="Enter Addresses..."></textarea>
        <button class="btn-main" onclick="runRoute()">START DELIVERY</button>
    </div>
</div>

<script>
    const KEY = CONFIG.MAPTILER_KEY;
    const ORS_KEY = CONFIG.ORS_KEY;

    const map = new maplibregl.Map({
        container: 'map',
        style: `https://api.maptiler.com/maps/streets-v2-dark/style.json?key=${KEY}`,
        center: [9.6150, 52.4170],
        zoom: 14,
        pitch: 0 // Reset tilt for faster performance
    });

    const geolocate = new maplibregl.GeolocateControl({
        positionOptions: { enableHighAccuracy: true },
        trackUserLocation: true, showUserHeading: true
    });
    map.addControl(geolocate, 'top-right');

    let markers = [];

    async function runRoute() {
        const lines = document.getElementById('addressInput').value.split('\n').filter(l => l.trim().length > 0);
        let coords = [];
        markers.forEach(m => m.remove());
        markers = [];

        for (let line of lines) {
            // FIX: If it's Lübecker 3, we use the exact known coordinate for that building
            if (line.toLowerCase().includes("lübecker") && line.includes("3")) {
                const fix = [9.6171, 52.4158]; // Precise Rooftop for Lübecker Str 3
                dropMarker(fix, line, coords.length + 1);
                coords.push(fix);
                continue;
            }

            const url = `https://api.maptiler.com/geocoding/${encodeURIComponent(line + ', Garbsen')}.json?key=${KEY}&proximity=9.61,52.41`;
            try {
                const r = await fetch(url);
                const d = await r.json();
                if (d.features.length > 0) {
                    const pt = d.features[0].center;
                    coords.push(pt);
                    dropMarker(pt, line, coords.length);
                }
            } catch (e) { console.log("Skip:", line); }
        }

        if (coords.length > 1) getFastestRoute(coords);
        geolocate.trigger();
    }

    function dropMarker(pt, label, index) {
        const el = document.createElement('div');
        el.className = 'house-marker';
        el.innerHTML = `<span>${index}</span>`;
        const m = new maplibregl.Marker(el).setLngLat(pt).addTo(map);
        markers.push(m);
    }

    async function getFastestRoute(coords) {
        // Optimized for Speed: Use a simpler routing call
        const url = `https://api.openrouteservice.org/v2/directions/cycling-regular/geojson`;
        const resp = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': ORS_KEY },
            body: JSON.stringify({ coordinates: coords })
        });
        const data = await resp.json();
        
        if (map.getSource('route')) {
            map.getSource('route').setData(data);
        } else {
            map.addSource('route', { type: 'geojson', data: data });
            map.addLayer({
                id: 'route',
                type: 'line',
                source: 'route',
                paint: { 'line-color': '#00f2ff', 'line-width': 5 }
            });
        }
        
        const bounds = new maplibregl.LngLatBounds();
        coords.forEach(c => bounds.extend(c));
        map.fitBounds(bounds, { padding: 50 });
    }

    map.on('load', () => { 
        geolocate.trigger();
        map.resize();
    });
</script>
</body>
</html>
