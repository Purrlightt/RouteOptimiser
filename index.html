<!DOCTYPE html>
<html>

<head>
    <title>CityPost All-Garbsen</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
    <script src="https://unpkg.com/maplibre-gl@3.0.0/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.0.0/dist/maplibre-gl.css" rel="stylesheet" />
    <style>
        :root {
            --accent: #ffcc00;
            --bg: #111;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            background: var(--bg);
            color: white;
        }

        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
        }

        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            background: rgba(30, 30, 30, 0.9);
            padding: 12px;
            border-radius: 12px;
            z-index: 10;
            border: 1px solid #444;
        }

        textarea {
            width: 100%;
            height: 60px;
            background: #222;
            color: #fff;
            border: 1px solid #555;
            border-radius: 6px;
            padding: 8px;
            font-size: 14px;
            box-sizing: border-box;
        }

        .controls {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        button {
            flex: 1;
            padding: 12px;
            border-radius: 6px;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-go {
            background: var(--accent);
            color: black;
        }

        .btn-clear {
            background: #444;
            color: white;
        }

        .house-marker {
            background: #ff3b30;
            color: white;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 2px solid white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 12px;
            box-shadow: 0 0 15px rgba(255, 59, 48, 0.5);
        }
    </style>
</head>

<body>

    <div id="ui">
        <textarea id="addressInput" placeholder="Paste all 308xx addresses here..."></textarea>
        <div class="controls">
            <button class="btn-go" onclick="startDelivery()">START ROUTE</button>
            <button class="btn-clear" onclick="location.reload()">CLEAR ALL</button>
        </div>
    </div>
    <div id="map"></div>

    <script>
        const MAPTILER_KEY = 'CcM6ytJu15GKv69XcBwC';
        const ORS_KEY = 'eyJvcmciOiI1YjNjZTM1OTc4NTExMTAwMDFjZjYyNDgiLCJpZCI6IjMzNWI2ZDBlMTk3YzRhZTZiNzkwZTQwYmEwNDhlOTM5IiwiaCI6Im11cm11cjY0In0=';

        const map = new maplibregl.Map({
            container: 'map',
            style: `https://api.maptiler.com/maps/streets-v2-dark/style.json?key=${KEY}`,
            center: [9.598, 52.428], // Better center for all of Garbsen
            zoom: 13,
            pitch: 30
        });

        const geolocate = new maplibregl.GeolocateControl({
            positionOptions: { enableHighAccuracy: true },
            trackUserLocation: true,
            showUserHeading: true
        });
        map.addControl(geolocate);

        let markers = [];

        async function startDelivery() {
            const lines = document.getElementById('addressInput').value.split('\n').filter(l => l.trim().length > 0);
            const coords = [];

            for (let line of lines) {
                // Expanded search to include all of Garbsen and nearby Seelze/Langenhagen
                const url = `https://api.maptiler.com/geocoding/${encodeURIComponent(line + ', Garbsen, Germany')}.json?key=${KEY}&fuzzy=false`;

                try {
                    const resp = await fetch(url);
                    const data = await resp.json();
                    if (data.features && data.features.length > 0) {
                        const feature = data.features[0];
                        const pt = feature.center;
                        coords.push(pt);

                        // Create marker with "Tap to Finish" feature
                        const el = document.createElement('div');
                        el.className = 'house-marker';
                        el.innerText = line.match(/\d+/); // Just the number

                        const m = new maplibregl.Marker(el).setLngLat(pt).addTo(map);

                        // Tap a house to mark it as DONE
                        el.addEventListener('click', () => {
                            if (confirm("Delivery finished at " + line + "?")) {
                                m.remove();
                            }
                        });
                        markers.push(m);
                    }
                } catch (e) { console.error(e); }
            }

            if (coords.length > 1) {
                drawBikeRoute(coords);
                geolocate.trigger();
            }
        }

        async function drawBikeRoute(coords) {
            const url = `https://api.openrouteservice.org/v2/directions/cycling-regular/geojson`;
            const resp = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': ORS_KEY },
                body: JSON.stringify({ "coordinates": coords })
            });
            const data = await resp.json();

            if (map.getSource('route')) {
                map.getSource('route').setData(data);
            } else {
                map.addSource('route', { type: 'geojson', data: data });
                map.addLayer({
                    id: 'route',
                    type: 'line',
                    source: 'route',
                    paint: { 'line-color': '#ffcc00', 'line-width': 5, 'line-opacity': 0.8 }
                });
            }

            const bounds = new maplibregl.LngLatBounds();
            coords.forEach(c => bounds.extend(c));
            map.fitBounds(bounds, { padding: 100 });
        }
    </script>
</body>

</html>
