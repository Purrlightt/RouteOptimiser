<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Garbsen Route Pro</title>
    <link rel="stylesheet" href="style.css">
    <script src="config.js"></script>
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
</head>
<body>

<div id="ui-wrapper">
    <div class="glass-card">
        <textarea id="addressInput" placeholder="Lübecker Str. 3..."></textarea>
        <div class="button-row">
            <button class="btn-primary" onclick="startDelivery()">Go</button>
            <button class="btn-dark" onclick="toggleSatellite()">Satellite</button>
            <button class="btn-dark" style="background:#400" onclick="resetApp()">Reset</button>
        </div>
    </div>
</div>

<div id="map"></div>

<script>
    const TILER_KEY = CONFIG.MAPTILER_KEY;
    const ORS_KEY = CONFIG.ORS_KEY;

    const map = new maplibregl.Map({
        container: 'map',
        style: `https://api.maptiler.com/maps/streets-v2-dark/style.json?key=${TILER_KEY}`,
        center: [9.605, 52.418], // Better center between Alt-Garbsen and Mitte
        zoom: 14
    });

    const geolocate = new maplibregl.GeolocateControl({
        positionOptions: { enableHighAccuracy: true },
        trackUserLocation: true, showUserHeading: true
    });
    map.addControl(geolocate, 'bottom-right');

    let markers = [];

    // AUTO-SAVE: Load previous addresses on startup
    window.onload = () => {
        const saved = localStorage.getItem('last_route');
        if (saved) document.getElementById('addressInput').value = saved;
    };

    function resetApp() {
        localStorage.removeItem('last_route');
        location.reload();
    }

    async function startDelivery() {
        const input = document.getElementById('addressInput').value;
        localStorage.setItem('last_route', input); // SAVE ROUTE
        
        const lines = input.split('\n').filter(l => l.trim().length > 0);
        const coords = [];
        markers.forEach(m => m.remove());
        markers = [];

        for (let line of lines) {
            // FIX: Prioritizing 30823 Garbsen to find Lübecker Str in Alt-Garbsen
            const query = encodeURIComponent(line + ', 30823 Garbsen, Germany');
            const url = `https://api.maptiler.com/geocoding/${query}.json?key=${TILER_KEY}&fuzzy=false`;
            
            try {
                const resp = await fetch(url);
                const data = await resp.json();
                
                if (data.features && data.features.length > 0) {
                    const pt = data.features[0].center;
                    coords.push(pt);

                    const el = document.createElement('div');
                    el.className = 'house-marker';
                    el.innerHTML = `<span>${line.match(/\d+/) || '!'}</span>`;
                    
                    const m = new maplibregl.Marker(el).setLngLat(pt).addTo(map);
                    el.onclick = () => { if(confirm("Delivered?")) m.remove(); };
                    markers.push(m);
                }
            } catch (e) { console.error(e); }
        }

        if (coords.length > 1) drawPath(coords);
        geolocate.trigger();
    }

    async function drawPath(coords) {
        const url = `https://api.openrouteservice.org/v2/directions/cycling-regular/geojson`;
        const resp = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': ORS_KEY },
            body: JSON.stringify({ "coordinates": coords })
        });
        const data = await resp.json();
        
        if (map.getSource('route')) {
            map.getSource('route').setData(data);
        } else {
            map.addSource('route', { type: 'geojson', data: data });
            map.addLayer({
                id: 'route',
                type: 'line',
                source: 'route',
                paint: { 'line-color': '#00d2ff', 'line-width': 5, 'line-opacity': 0.8 }
            });
        }
        
        const bounds = new maplibregl.LngLatBounds();
        coords.forEach(c => bounds.extend(c));
        map.fitBounds(bounds, { padding: 120 });
    }

    function toggleSatellite() {
        const current = map.getStyle().name;
        map.setStyle(current === 'Satellite' 
            ? `https://api.maptiler.com/maps/streets-v2-dark/style.json?key=${TILER_KEY}`
            : `https://api.maptiler.com/maps/hybrid/style.json?key=${TILER_KEY}`);
    }

    map.on('load', () => { 
        geolocate.trigger();
        map.resize(); 
    });
</script>
</body>
</html>
