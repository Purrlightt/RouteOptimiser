<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CityPost TurboRoute</title>
    <link rel="stylesheet" href="style.css">
    <script src="config.js"></script>
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
</head>
<body>

<div id="map"></div>
<div id="ui-panel">
    <div class="input-row">
        <input type="text" id="streetInput" placeholder="Street + No">
        <select id="plzSelect">
            <option value="30823">30823</option>
            <option value="30826">30826</option>
            <option value="30827">30827</option>
        </select>
        <button class="btn-add" onclick="addToQueue()">ADD</button>
    </div>
    <div id="addressQueue" class="queue-container"></div>
    <div class="action-row">
        <button class="btn-clear" onclick="clearAll()">Clear</button>
        <button class="btn-route" onclick="calculateRoute()">START OPTIMAL ROUTE</button>
    </div>
</div>

<script>
    const T_KEY = CONFIG.MAPTILER_KEY;
    const O_KEY = CONFIG.ORS_KEY;
    let userLoc = null, queue = [], markers = [];

    const map = new maplibregl.Map({
        container: 'map',
        style: `https://api.maptiler.com/maps/streets-v2-dark/style.json?key=${T_KEY}`,
        center: [9.617, 52.415], zoom: 15
    });

    const geolocate = new maplibregl.GeolocateControl({
        positionOptions: { enableHighAccuracy: true },
        trackUserLocation: true, showUserHeading: true
    });
    map.addControl(geolocate);
    geolocate.on('geolocate', (e) => userLoc = [e.coords.longitude, e.coords.latitude]);

    function addToQueue() {
        const street = document.getElementById('streetInput').value.trim();
        const plz = document.getElementById('plzSelect').value;
        if (street) { queue.push({ street, plz }); updateUI(); document.getElementById('streetInput').value = ""; }
    }

    function clearAll() { queue = []; updateUI(); markers.forEach(m => m.remove()); markers = []; if(map.getSource('route')) map.getSource('route').setData({type:'FeatureCollection', features:[]}); }

    function updateUI() {
        document.getElementById('addressQueue').innerHTML = queue.map((item, i) => `
            <div class="queue-item"><span><b>${item.plz}</b> ${item.street}</span><span style="color:red" onclick="queue.splice(${i},1);updateUI()">X</span></div>
        `).join('');
    }

    async function calculateRoute() {
        if (queue.length === 0 || !userLoc) return alert("Add stops and wait for GPS lock!");
        markers.forEach(m => m.remove()); markers = [];
        let coords = [];

        // 1. Get Coordinates
        for (let item of queue) {
            const r = await fetch(`https://api.maptiler.com/geocoding/${encodeURIComponent(item.street + ', ' + item.plz + ' Garbsen')}.json?key=${T_KEY}&limit=1`);
            const d = await r.json();
            if (d.features.length > 0) coords.push({ name: item.street, pt: d.features[0].center });
        }

        // 2. Optimize Sequence (Traveling Salesman)
        const optResp = await fetch(`https://api.openrouteservice.org/optimization`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': O_KEY },
            body: JSON.stringify({
                jobs: coords.map((c, i) => ({ id: i, location: c.pt })),
                vehicles: [{ id: 0, profile: "cycling-regular", start: userLoc }]
            })
        });
        const optData = await optResp.json();
        
        // 3. Extract Sorted Coords & Draw
        const sortedSteps = optData.routes[0].steps;
        const finalPath = sortedSteps.map(s => s.location);
        
        // Draw Route
        const routeResp = await fetch(`https://api.openrouteservice.org/v2/directions/cycling-regular/geojson`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': O_KEY },
            body: JSON.stringify({ coordinates: finalPath })
        });
        const routeData = await routeResp.json();
        if (map.getSource('route')) map.getSource('route').setData(routeData);
        else {
            map.addSource('route', { type: 'geojson', data: routeData });
            map.addLayer({ id: 'route', type: 'line', source: 'route', paint: { 'line-color': '#00f2ff', 'line-width': 6 } });
        }

        // Drop Numbered Markers
        sortedSteps.forEach((step, i) => {
            if (step.type === "job") {
                const el = document.createElement('div'); el.className = 'house-marker'; el.innerHTML = i;
                markers.push(new maplibregl.Marker(el).setLngLat(step.location).addTo(map));
            }
        });

        const bounds = new maplibregl.LngLatBounds();
        finalPath.forEach(c => bounds.extend(c));
        map.fitBounds(bounds, { padding: 50 });
    }

    map.on('load', () => { geolocate.trigger(); map.resize(); });
</script>
</body>
</html>
