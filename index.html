<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CityPost Pro</title>
    <link rel="stylesheet" href="style.css">
    <script src="config.js"></script>
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
</head>
<body>

<div id="map"></div>

<div id="ui-deck">
    <div class="cyber-card">
        <textarea id="addressInput" placeholder="Enter stops (one per line)..."></textarea>
        <div class="btn-row">
            <button class="btn-alt" onclick="toggleSatellite()">Satellite</button>
            <button class="btn-main" onclick="startDelivery()">Optimize & Go</button>
        </div>
    </div>
</div>

<script>
    const KEY = CONFIG.MAPTILER_KEY;
    const ORS_KEY = CONFIG.ORS_KEY;
    let userLoc = null;
    let markers = [];

    const map = new maplibregl.Map({
        container: 'map',
        style: `https://api.maptiler.com/maps/streets-v2-dark/style.json?key=${KEY}`,
        center: [9.617, 52.415], zoom: 15, pitch: 0
    });

    const geolocate = new maplibregl.GeolocateControl({
        positionOptions: { enableHighAccuracy: true },
        trackUserLocation: true, showUserHeading: true
    });
    map.addControl(geolocate);

    // Track real-time GPS
    geolocate.on('geolocate', (e) => { 
        userLoc = [e.coords.longitude, e.coords.latitude]; 
    });

    async function startDelivery() {
        const input = document.getElementById('addressInput').value;
        const lines = input.split('\n').filter(l => l.trim().length > 0);
        let coords = [];
        
        // Start from current location if possible
        if (userLoc) coords.push(userLoc);

        markers.forEach(m => m.remove()); markers = [];

        for (let line of lines) {
            // THE LÜBECKER HARD-FIX: Forces the residential address in Alt-Garbsen
            if (line.toLowerCase().includes("lübecker") && line.includes("3")) {
                const fix = [9.6171, 52.4158]; // Rooftop coordinate
                coords.push(fix);
                dropMarker(fix, coords.length);
                continue;
            }

            let query = encodeURIComponent(line.trim() + ', 30823 Garbsen');
            const url = `https://api.maptiler.com/geocoding/${query}.json?key=${KEY}&limit=1`;
            
            try {
                const r = await fetch(url);
                const d = await r.json();
                if (d.features.length > 0) {
                    const pt = d.features[0].center;
                    coords.push(pt);
                    dropMarker(pt, coords.length);
                }
            } catch (e) { console.error("Search Error:", line); }
        }

        if (coords.length > 1) drawRoute(coords);
    }

    function dropMarker(pt, index) {
        const el = document.createElement('div');
        el.className = 'house-marker';
        el.innerHTML = `<span>${index}</span>`;
        markers.push(new maplibregl.Marker(el).setLngLat(pt).addTo(map));
    }

    async function drawRoute(coordinates) {
        const url = `https://api.openrouteservice.org/v2/directions/cycling-regular/geojson`;
        try {
            const resp = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': ORS_KEY },
                body: JSON.stringify({ coordinates: coordinates })
            });
            const data = await resp.json();
            
            if (map.getSource('route')) {
                map.getSource('route').setData(data);
            } else {
                map.addSource('route', { type: 'geojson', data: data });
                map.addLayer({
                    id: 'route', type: 'line', source: 'route',
                    paint: { 'line-color': '#00f2ff', 'line-width': 6, 'line-opacity': 0.8 }
                });
            }
            const bounds = new maplibregl.LngLatBounds();
            coordinates.forEach(c => bounds.extend(c));
            map.fitBounds(bounds, { padding: 80 });
        } catch (e) { console.error("Route Logic Failed"); }
    }

    function toggleSatellite() {
        const current = map.getStyle().name;
        map.setStyle(current === 'Satellite' 
            ? `https://api.maptiler.com/maps/streets-v2-dark/style.json?key=${KEY}`
            : `https://api.maptiler.com/maps/hybrid/style.json?key=${KEY}`);
    }

    map.on('load', () => { 
        geolocate.trigger();
        map.resize(); 
    });
</script>
</body>
</html>
