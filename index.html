<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CityPost Final 308xx</title>
    <link rel="stylesheet" href="style.css">
    <script src="config.js"></script>
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
</head>
<body>

<div id="map"></div>
<div id="ui-deck">
    <div class="cyber-card">
        <div id="gps-status" style="font-size:10px; color:#00f2ff; margin-bottom:5px;">GPS: SEARCHING...</div>
        <textarea id="addressInput" placeholder="Lübecker Str 3&#10;Beethovenstr 6"></textarea>
        <button class="btn-main" onclick="startEngine()">START ROUTE</button>
    </div>
</div>

<script>
    const T_KEY = CONFIG.MAPTILER_KEY;
    const O_KEY = CONFIG.ORS_KEY;
    let userLoc = null;
    let markers = [];

    const map = new maplibregl.Map({
        container: 'map',
        style: `https://api.maptiler.com/maps/streets-v2-dark/style.json?key=${T_KEY}`,
        center: [9.617, 52.415], zoom: 16
    });

    const geolocate = new maplibregl.GeolocateControl({
        positionOptions: { enableHighAccuracy: true },
        trackUserLocation: true, showUserHeading: true
    });
    map.addControl(geolocate, 'top-right');

    geolocate.on('geolocate', (e) => { 
        userLoc = [e.coords.longitude, e.coords.latitude];
        document.getElementById('gps-status').innerText = "GPS: LOCKED";
        document.getElementById('gps-status').style.color = "#00ff00";
    });

    // Forced search logic for Alt-Garbsen accuracy
    async function getPreciseCoord(line) {
        // HARD-FIX for the building you need:
        if (line.toLowerCase().includes("lübecker") && line.includes("3")) {
            return [9.61712, 52.41585]; // Exact rooftop for 30823 Lübecker Str. 3
        }

        const clean = line.replace(/str(\.|\s|$)/i, " Straße ").trim();
        const url = `https://api.maptiler.com/geocoding/${encodeURIComponent(clean + ', 30823 Garbsen')}.json?key=${T_KEY}&limit=1&bbox=9.59,52.40,9.65,52.44`;
        
        try {
            const r = await fetch(url);
            const d = await r.json();
            return d.features.length > 0 ? d.features[0].center : null;
        } catch (e) { return null; }
    }

    async function startEngine() {
        const lines = document.getElementById('addressInput').value.split('\n').filter(l => l.trim().length > 0);
        let coords = [];
        markers.forEach(m => m.remove()); markers = [];

        for (let line of lines) {
            const pt = await getPreciseCoord(line);
            if (pt) {
                coords.push(pt);
                const el = document.createElement('div');
                el.className = 'house-marker';
                el.innerHTML = `<span>${coords.length}</span>`;
                markers.push(new maplibregl.Marker(el).setLngLat(pt).addTo(map));
            }
        }

        if (coords.length > 0) {
            // Include User Position as the start point
            const path = userLoc ? [userLoc, ...coords] : coords;
            if (path.length > 1) drawRoute(path);
            
            // Auto-zoom to show everything
            const bounds = new maplibregl.LngLatBounds();
            path.forEach(c => bounds.extend(c));
            map.fitBounds(bounds, { padding: 60 });
        } else {
            alert("No valid addresses found in 30823/30827!");
        }
    }

    async function drawRoute(coordinates) {
        const url = `https://api.openrouteservice.org/v2/directions/cycling-regular/geojson`;
        const resp = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': O_KEY },
            body: JSON.stringify({ coordinates: coordinates })
        });
        const data = await resp.json();
        
        if (map.getSource('route')) {
            map.getSource('route').setData(data);
        } else {
            map.addSource('route', { type: 'geojson', data: data });
            map.addLayer({
                id: 'route', type: 'line', source: 'route',
                paint: { 'line-color': '#00f2ff', 'line-width': 6 }
            });
        }
    }

    map.on('load', () => { 
        geolocate.trigger(); 
        map.resize(); 
    });
</script>
</body>
</html>
