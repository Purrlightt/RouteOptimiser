<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CityPost Pro | 308xx</title>
    <link rel="stylesheet" href="style.css">

    <script src="config.js"></script>
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
</head>

<body>

    <div id="ui-container">
        <div class="glass-panel">
            <textarea id="addressInput" placeholder="Paste Garbsen addresses..."></textarea>
            <div class="btn-group">
                <button class="btn-main" onclick="startDelivery()">Optimize</button>
                <button class="btn-secondary" onclick="toggleSatellite()">SAT</button>
            </div>
        </div>
    </div>

    <div id="map"></div>

    <script>
        // Access keys from the config.js file
        const TILER_KEY = CONFIG.MAPTILER_KEY;
        const ORS_KEY = CONFIG.ORS_KEY;

        const map = new maplibregl.Map({
            container: 'map',
            style: `https://api.maptiler.com/maps/streets-v2-dark/style.json?key=${TILER_KEY}`,
            center: [9.598, 52.428],
            zoom: 14,
            maxZoom: 19
        });

        const geolocate = new maplibregl.GeolocateControl({
            positionOptions: { enableHighAccuracy: true },
            trackUserLocation: true,
            showUserHeading: true
        });
        map.addControl(geolocate, 'bottom-right');

        let deliveryPoints = [];

        // PROXIMITY ALERT: Checks if you are near a house
        geolocate.on('geolocate', (position) => {
            const userLoc = [position.coords.longitude, position.coords.latitude];

            deliveryPoints.forEach(p => {
                const dist = getDistance(userLoc, p.coords);
                if (dist < 0.02) { // Roughly 20 meters
                    if (!p.notified) {
                        if ("vibrate" in navigator) navigator.vibrate([200, 100, 200]);
                        p.notified = true;
                        console.log("Arrived at stop!");
                    }
                }
            });
        });

        function getDistance(c1, c2) {
            return Math.sqrt(Math.pow(c1[0] - c2[0], 2) + Math.pow(c1[1] - c2[1], 2));
        }

        async function startDelivery() {
            const lines = document.getElementById('addressInput').value.split('\n').filter(l => l.trim().length > 0);
            deliveryPoints = [];

            for (let line of lines) {
                const url = `https://api.maptiler.com/geocoding/${encodeURIComponent(line + ', Garbsen, Germany')}.json?key=${TILER_KEY}&fuzzy=false`;
                try {
                    const resp = await fetch(url);
                    const data = await resp.json();
                    if (data.features && data.features.length > 0) {
                        const pt = data.features[0].center;
                        deliveryPoints.push({ coords: pt, notified: false, address: line });

                        const el = document.createElement('div');
                        el.className = 'house-marker';
                        el.innerText = line.match(/\d+/) || '!';
                        new maplibregl.Marker(el).setLngLat(pt).addTo(map);
                    }
                } catch (e) { console.error(e); }
            }
            geolocate.trigger();
        }

        function toggleSatellite() {
            const current = map.getStyle().name;
            const newStyle = current === 'Satellite'
                ? `https://api.maptiler.com/maps/streets-v2-dark/style.json?key=${TILER_KEY}`
                : `https://api.maptiler.com/maps/hybrid/style.json?key=${TILER_KEY}`;
            map.setStyle(newStyle);
        }

        map.on('load', () => {
            geolocate.trigger();
            map.resize();
        });
    </script>
</body>

</html>
