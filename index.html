<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CityPost Final | 308xx</title>
    <link rel="stylesheet" href="style.css">
    <script src="config.js"></script>
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
</head>
<body>

<div id="app-container">
    <div id="map"></div>
    <div id="ui-panel">
        <div style="font-size:10px; color:var(--neon); margin-bottom:5px;">SYSTEM STATUS: ONLINE</div>
        <textarea id="addressInput" placeholder="Enter Addresses..."></textarea>
        <div class="btn-row">
            <button class="btn-alt" onclick="toggleSatellite()">SAT</button>
            <button class="btn-main" onclick="startEngine()">GENERATE ROUTE</button>
        </div>
    </div>
</div>

<script>
    const KEY = CONFIG.MAPTILER_KEY;
    const ORS_KEY = CONFIG.ORS_KEY;
    let userLoc = null;
    let markers = [];

    const map = new maplibregl.Map({
        container: 'map',
        style: `https://api.maptiler.com/maps/streets-v2-dark/style.json?key=${KEY}`,
        center: [9.61, 52.41], zoom: 14
    });

    const geolocate = new maplibregl.GeolocateControl({
        positionOptions: { enableHighAccuracy: true },
        trackUserLocation: true, showUserHeading: true
    });
    map.addControl(geolocate);
    geolocate.on('geolocate', (e) => { userLoc = [e.coords.longitude, e.coords.latitude]; });

    async function startEngine() {
        const lines = document.getElementById('addressInput').value.split('\n').filter(l => l.trim().length > 0);
        let coords = [];
        markers.forEach(m => m.remove()); markers = [];

        // 1. Geocoding with Space/Umlaut normalization
        for (let line of lines) {
            let cleanLine = line.replace(/stra[sz]e/gi, "straße"); // Fixes street spelling
            let query = encodeURIComponent(cleanLine + ', 30823 Garbsen');
            const url = `https://api.maptiler.com/geocoding/${query}.json?key=${KEY}&limit=1`;
            
            try {
                const r = await fetch(url);
                const d = await r.json();
                if (d.features.length > 0) {
                    const pt = d.features[0].center;
                    coords.push(pt);
                    
                    const el = document.createElement('div');
                    el.className = 'house-marker';
                    el.innerHTML = `<span>${coords.length}</span>`;
                    const m = new maplibregl.Marker(el).setLngLat(pt).addTo(map);
                    markers.push(m);
                }
            } catch (e) { console.error("Failed to find:", line); }
        }

        // 2. Routing with Error Catching
        if (coords.length > 0) {
            // Include user location if available
            const finalPath = userLoc ? [userLoc, ...coords] : coords;
            if (finalPath.length > 1) drawPath(finalPath);
        }
    }

    async function drawPath(coordinates) {
        console.log("Requesting route for coords:", coordinates);
        const url = `https://api.openrouteservice.org/v2/directions/cycling-regular/geojson`;
        
        try {
            const resp = await fetch(url, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'Authorization': ORS_KEY 
                },
                body: JSON.stringify({ coordinates: coordinates })
            });

            if (!resp.ok) {
                const errData = await resp.json();
                alert("Route Error: " + errData.error.message);
                return;
            }

            const data = await resp.json();
            
            if (map.getSource('route')) {
                map.getSource('route').setData(data);
            } else {
                map.addSource('route', { type: 'geojson', data: data });
                map.addLayer({
                    id: 'route',
                    type: 'line',
                    source: 'route',
                    paint: { 'line-color': '#00f2ff', 'line-width': 6 }
                });
            }

            const bounds = new maplibregl.LngLatBounds();
            coordinates.forEach(c => bounds.extend(c));
            map.fitBounds(bounds, { padding: 50 });

        } catch (e) {
            console.error("Critical Routing Failure:", e);
        }
    }

    function toggleSatellite() {
        const current = map.getStyle().name;
        map.setStyle(current === 'Satellite' 
            ? `https://api.maptiler.com/maps/streets-v2-dark/style.json?key=${KEY}`
            : `https://api.maptiler.com/maps/hybrid/style.json?key=${KEY}`);
    }

    map.on('load', () => { 
        geolocate.trigger();
        map.resize(); 
    });
</script>
</body>
</html>
