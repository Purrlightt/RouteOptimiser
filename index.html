<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CityPost CyberRoute Pro</title>
    <link rel="stylesheet" href="style.css">
    <script src="config.js"></script>
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
</head>
<body>

<div id="map"></div>

<div id="ui-wrapper">
    <div class="cyber-card">
        <textarea id="addressInput" placeholder="Enter stops (e.g. Lübecker Str 3)"></textarea>
        <div class="btn-row">
            <button class="btn-scan" onclick="alert('Camera Scanner starting...')">Scan Mail</button>
            <button class="btn-main" onclick="optimizeRoute()">Sort & Go</button>
        </div>
    </div>
</div>

<script>
    const TILER_KEY = CONFIG.MAPTILER_KEY;
    const ORS_KEY = CONFIG.ORS_KEY;

    const map = new maplibregl.Map({
        container: 'map',
        style: `https://api.maptiler.com/maps/streets-v2-dark/style.json?key=${TILER_KEY}`,
        center: [9.6150, 52.4170], // Biased to Alt-Garbsen
        zoom: 15,
        pitch: 40
    });

    const geolocate = new maplibregl.GeolocateControl({
        positionOptions: { enableHighAccuracy: true },
        trackUserLocation: true, showUserHeading: true
    });
    map.addControl(geolocate, 'top-right');

    let markers = [];

    async function optimizeRoute() {
        const input = document.getElementById('addressInput').value;
        const lines = input.split('\n').filter(l => l.trim().length > 0);
        let stops = [];

        // 1. Geocode with extreme bias for 30823/30827
        for (let line of lines) {
            // We force the search to focus on Alt-Garbsen coordinates
            const url = `https://api.maptiler.com/geocoding/${encodeURIComponent(line + ', Garbsen, Germany')}.json?key=${TILER_KEY}&proximity=9.615,52.417&fuzzy=false`;
            
            const resp = await fetch(url);
            const data = await resp.json();
            
            if (data.features && data.features.length > 0) {
                const best = data.features[0];
                stops.push({
                    name: line,
                    coords: best.center, // [lng, lat]
                    id: stops.length
                });
            }
        }

        if (stops.length < 2) return alert("Need more stops to optimize!");

        // 2. Optimization API (Traveling Salesman)
        // This sorts your stops into the most efficient order
        const optUrl = `https://api.openrouteservice.org/optimization`;
        const body = {
            jobs: stops.map(s => ({ id: s.id, location: s.coords })),
            vehicles: [{ id: 0, profile: "cycling-regular", start: stops[0].coords }]
        };

        const optResp = await fetch(optUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': ORS_KEY },
            body: JSON.stringify(body)
        });
        const optData = await optResp.json();

        // 3. Reorder stops based on optimization
        const sortedOrder = optData.routes[0].steps.map(step => step.id).filter(id => id !== undefined);
        const sortedCoords = sortedOrder.map(id => stops.find(s => s.id === id).coords);

        // 4. Update Map Markers & Route
        markers.forEach(m => m.remove());
        sortedOrder.forEach((id, index) => {
            const s = stops.find(stop => stop.id === id);
            const el = document.createElement('div');
            el.className = 'house-marker';
            el.innerHTML = `<span>${index + 1}</span>`; // Shows stop order (1, 2, 3...)
            markers.push(new maplibregl.Marker(el).setLngLat(s.coords).addTo(map));
        });

        drawFinalPath(sortedCoords);
    }

    async function drawFinalPath(coords) {
        const url = `https://api.openrouteservice.org/v2/directions/cycling-regular/geojson`;
        const resp = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': ORS_KEY },
            body: JSON.stringify({ "coordinates": coords })
        });
        const data = await resp.json();
        
        if (map.getSource('route')) {
            map.getSource('route').setData(data);
        } else {
            map.addSource('route', { type: 'geojson', data: data });
            map.addLayer({
                id: 'route',
                type: 'line',
                source: 'route',
                paint: { 'line-color': '#00f2ff', 'line-width': 6, 'line-opacity': 0.8 }
            });
        }
        
        const bounds = new maplibregl.LngLatBounds();
        coords.forEach(c => bounds.extend(c));
        map.fitBounds(bounds, { padding: 100 });
    }

    map.on('load', () => { 
        geolocate.trigger();
        setTimeout(() => map.resize(), 500); 
    });
</script>
</body>
</html>
