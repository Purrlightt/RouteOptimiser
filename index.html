<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CityPost First-Person Nav</title>
    
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />

    <style>
        :root { --neon: #00f2ff; --purple: #7000ff; --danger: #ff4444; --success: #00ffaa; --bg: #050505; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: #fff; font-family: -apple-system, sans-serif; overflow: hidden; }
        
        #app-wrapper { display: flex; flex-direction: column; height: 100vh; width: 100vw; }
        #map { flex: 1; width: 100%; z-index: 1; position: relative; }

        #povBtn {
            position: absolute; top: 15px; left: 15px; z-index: 10;
            background: rgba(10, 10, 10, 0.8); border: 1px solid var(--neon); color: var(--neon);
            padding: 10px 15px; border-radius: 8px; font-weight: 900; cursor: pointer;
            backdrop-filter: blur(5px); text-transform: uppercase; font-size: 12px;
            box-shadow: 0 0 10px rgba(0, 242, 255, 0.2); transition: all 0.3s;
        }

        #ui-panel {
            height: 45%; background: #0a0a0a; border-top: 2px solid var(--neon);
            display: flex; flex-direction: column; padding: 15px; z-index: 99999;
            box-sizing: border-box; box-shadow: 0 -10px 40px rgba(0,0,0,0.9);
        }

        .status-bar { display: flex; justify-content: space-between; font-size: 11px; color: var(--neon); margin-bottom: 10px; font-weight: 800; text-transform: uppercase; }
        .input-row { display: flex; gap: 8px; margin-bottom: 10px; }
        input { flex: 2; background: #111; color: #fff; border: 1px solid #333; padding: 14px; border-radius: 10px; font-size: 16px; outline: none; }
        input:focus { border-color: var(--neon); }
        select { flex: 1; background: #111; color: var(--neon); border: 1px solid #333; border-radius: 10px; font-weight: bold; text-align: center; }

        .queue-list { flex: 1; overflow-y: auto; background: #000; border-radius: 10px; border: 1px solid #222; margin-bottom: 10px; }
        .queue-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 15px; border-bottom: 1px solid #1a1a1a; color: #ffffff !important; font-size: 14px; font-weight: 500; }
        
        .item-actions { display: flex; gap: 15px; align-items: center; }
        .btn-arrive { color: var(--success); font-weight: 900; font-size: 20px; cursor: pointer; padding: 0 5px; }
        .btn-remove { color: var(--danger); font-weight: 900; font-size: 18px; cursor: pointer; padding: 0 5px; }

        .action-row { display: flex; gap: 8px; }
        button { padding: 15px; border: none; border-radius: 10px; font-weight: 800; cursor: pointer; text-transform: uppercase; font-size: 12px; transition: 0.2s; }
        button:active { transform: scale(0.95); }
        .btn-add { background: var(--neon); color: #000; }
        .btn-clear { background: #2a0000; color: #ff5555; border: 1px solid #550000; }
        .btn-route { flex: 2; background: linear-gradient(90deg, var(--neon), var(--purple)); color: #fff; box-shadow: 0 4px 15px rgba(112, 0, 255, 0.4); }

        .house-marker { width: 32px; height: 32px; background: #000; border: 2px solid var(--neon); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--neon); font-weight: 900; font-size: 14px; box-shadow: 0 0 15px var(--neon); }
    </style>
</head>
<body>

<div id="app-wrapper">
    <div id="map">
        <button id="povBtn" onclick="togglePOV()">3D SAT POV</button>
    </div>
    
    <div id="ui-panel">
        <div class="status-bar">
            <span id="status">GPS: Initializing...</span>
            <span id="stop-count">0 Stops</span>
        </div>
        
        <div class="input-row">
            <input type="text" id="streetInput" placeholder="Straße + Nr">
            <select id="plzSelect">
                <option value="30823">30823</option>
                <option value="30826">30826</option>
                <option value="30827">30827</option>
            </select>
            <button class="btn-add" onclick="addStop()">ADD</button>
        </div>
        
        <div id="addressQueue" class="queue-list"></div>
        
        <div class="action-row">
            <button class="btn-clear" onclick="clearAll()">Clear</button>
            <button class="btn-route" onclick="startBasicRoute()">START DELIVERY</button>
        </div>
    </div>
</div>

<script>
    // --- PASTE YOUR KEYS HERE ---
    const T_KEY = "CcM6ytJu15GKv69XcBwC"; 
    const O_KEY = "eyJvcmciOiI1YjNjZTM1OTc4NTExMTAwMDFjZjYyNDgiLCJpZCI6IjMzNWI2ZDBlMTk3YzRhZTZiNzkwZTQwYmEwNDhlOTM5IiwiaCI6Im11cm11cjY0In0=";
    // ----------------------------

    let userLoc = null;
    let lastHeading = 0; // Tracks the direction your phone is facing
    let queue = [];
    let markers = [];
    let is3D = false;
    let currentRouteGeoJSON = null; 

    const map = new maplibregl.Map({
        container: 'map',
        style: `https://api.maptiler.com/maps/streets-v2-dark/style.json?key=${T_KEY}`,
        center: [9.617, 52.415], zoom: 15, pitch: 0, bearing: 0
    });

    const geolocate = new maplibregl.GeolocateControl({
        positionOptions: { enableHighAccuracy: true },
        trackUserLocation: true, 
        showUserHeading: true 
    });
    map.addControl(geolocate, 'top-right');

    // EVERY TIME YOUR GPS MOVES OR YOU TURN YOUR PHONE:
    geolocate.on('geolocate', (e) => {
        userLoc = [e.coords.longitude, e.coords.latitude];
        
        // If your phone provides compass/heading data, use it. Otherwise keep the last known direction.
        if (e.coords.heading !== null && !isNaN(e.coords.heading)) {
            lastHeading = e.coords.heading;
        }

        // If POV mode is active, lock the camera to your location AND your rotation
        if (is3D) {
            map.easeTo({
                center: userLoc,
                bearing: lastHeading, // This physically rotates the map
                pitch: 65,
                zoom: 18.5,
                duration: 1000 // Smooth following motion
            });
        }

        document.getElementById('status').innerText = "GPS: Locked";
        document.getElementById('status').style.color = "#00ff00";
    });

    // Automatically redraw the route line when switching from Dark Mode to Satellite
    map.on('style.load', () => {
        if (currentRouteGeoJSON) {
            drawRouteLayer();
        }
    });

    function togglePOV() {
        is3D = !is3D;
        const btn = document.getElementById('povBtn');
        
        if (is3D) {
            // Activate Satellite & rotate to face forward immediately
            map.setStyle(`https://api.maptiler.com/maps/hybrid/style.json?key=${T_KEY}`);
            map.easeTo({ pitch: 65, zoom: 18.5, bearing: lastHeading });
            
            btn.innerText = "2D MAP";
            btn.style.background = "var(--purple)";
            btn.style.color = "#fff";
            btn.style.borderColor = "var(--purple)";
        } else {
            // Return to Dark Mode, look straight down, North up
            map.setStyle(`https://api.maptiler.com/maps/streets-v2-dark/style.json?key=${T_KEY}`);
            map.easeTo({ pitch: 0, zoom: 15, bearing: 0 });
            
            btn.innerText = "3D SAT POV";
            btn.style.background = "rgba(10, 10, 10, 0.8)";
            btn.style.color = "var(--neon)";
            btn.style.borderColor = "var(--neon)";
        }
    }

    async function addStop() {
        const street = document.getElementById('streetInput').value.trim();
        const plz = document.getElementById('plzSelect').value;
        if (!street) return;

        document.getElementById('status').innerText = "Locating...";
        const cleanStreet = street.replace(/\s+/g, '+');
        const url = `https://api.maptiler.com/geocoding/${encodeURIComponent(cleanStreet)},${plz}+Garbsen.json?key=${T_KEY}&limit=1&bbox=9.55,52.38,9.68,52.46`;

        try {
            const r = await fetch(url);
            const d = await r.json();
            
            if (d.features && d.features.length > 0) {
                const pt = d.features[0].center;
                const id = Date.now();
                queue.push({ street, plz, coords: pt, id });
                
                updateUI();
                document.getElementById('streetInput').value = "";
                document.getElementById('status').innerText = "Added: " + street;
                
                const el = document.createElement('div');
                el.className = 'house-marker';
                el.innerHTML = queue.length;
                const m = new maplibregl.Marker(el).setLngLat(pt).addTo(map);
                markers.push({ id, marker: m });

                if (!is3D) map.easeTo({ center: pt, zoom: 15 });
            } else {
                document.getElementById('status').innerText = "Not found in " + plz;
            }
        } catch (e) { document.getElementById('status').innerText = "Search Error"; }
    }

    function updateUI() {
        document.getElementById('stop-count').innerText = `${queue.length} Stops`;
        document.getElementById('addressQueue').innerHTML = queue.map((item) => `
            <div class="queue-item">
                <span><b>${item.plz}</b> ${item.street}</span>
                <div class="item-actions">
                    <span class="btn-arrive" onclick="markArrived(${item.id})" title="Arrived">✓</span>
                    <span class="btn-remove" onclick="removeStop(${item.id})" title="Delete">✕</span>
                </div>
            </div>
        `).join('');
    }

    function removeStop(id) {
        const qIdx = queue.findIndex(q => q.id === id);
        if (qIdx > -1) {
            queue.splice(qIdx, 1);
            const mIdx = markers.findIndex(m => m.id === id);
            if (mIdx > -1) { markers[mIdx].marker.remove(); markers.splice(mIdx, 1); }
            updateUI();
            markers.forEach((mObj, index) => { mObj.marker.getElement().innerHTML = index + 1; });
        }
    }

    // Dynamic Route Recalculation on Arrival
    function markArrived(id) {
        removeStop(id); 
        if (queue.length > 0) {
            startBasicRoute(); 
        } else {
            clearAll();
            document.getElementById('status').innerText = "Deliveries Complete! 🎉";
        }
    }

    function clearAll() {
        queue = []; markers.forEach(m => m.marker.remove()); markers = [];
        currentRouteGeoJSON = null;
        if (map.getLayer('route-arrows')) map.removeLayer('route-arrows');
        if (map.getLayer('route-line')) map.removeLayer('route-line');
        if (map.getSource('route')) map.removeSource('route');
        updateUI();
        document.getElementById('status').innerText = "Cleared";
        if(is3D) togglePOV(); 
    }

    // The foolproof drawing function
    function drawRouteLayer() {
        if (!currentRouteGeoJSON) return;

        if (!map.getSource('route')) {
            map.addSource('route', { type: 'geojson', data: currentRouteGeoJSON });
        } else {
            map.getSource('route').setData(currentRouteGeoJSON);
        }

        // Layer 1: Neon Dotted Line
        if (!map.getLayer('route-line')) {
            map.addLayer({ 
                id: 'route-line', type: 'line', source: 'route', 
                layout: { 'line-join': 'round', 'line-cap': 'round' },
                paint: { 'line-color': '#00f2ff', 'line-width': 6, 'line-dasharray': [2, 3] } 
            });
        }

        // Layer 2: Purple Flow Arrows
        if (!map.getLayer('route-arrows')) {
            map.addLayer({
                id: 'route-arrows', type: 'symbol', source: 'route',
                layout: {
                    'symbol-placement': 'line',
                    'text-field': '▶',
                    'text-size': 18,
                    'symbol-spacing': 50, // Puts an arrow every 50 pixels along the route
                    'text-keep-upright': false // Forces the arrow to point along the line's path
                },
                paint: {
                    'text-color': '#7000ff',
                    'text-halo-color': '#000',
                    'text-halo-width': 2
                }
            });
        }
    }

    async function startBasicRoute() {
        if (!userLoc) return alert("Wait for GPS lock!");
        if (queue.length === 0) return alert("Add stops first!");

        document.getElementById('status').innerText = "Drawing Route...";
        const coords = [userLoc, ...queue.map(q => q.coords)];

        try {
            const authHeader = O_KEY.trim(); 
            const routeResp = await fetch(`https://api.openrouteservice.org/v2/directions/cycling-regular/geojson`, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'Authorization': authHeader 
                },
                body: JSON.stringify({ coordinates: coords })
            });
            
            if (!routeResp.ok) throw new Error("API Connection Failed");
            
            currentRouteGeoJSON = await routeResp.json();
            drawRouteLayer();

            if (!is3D) {
                const bounds = new maplibregl.LngLatBounds();
                coords.forEach(p => bounds.extend(p));
                map.fitBounds(bounds, { padding: 60 });
            }
            
            document.getElementById('status').innerText = "Route Active!";
            
            // Wait 1 second, then snap to first-person view
            if (!is3D) setTimeout(togglePOV, 1000);

        } catch (e) { 
            document.getElementById('status').innerText = "Routing Failed"; 
        }
    }

    map.on('load', () => { geolocate.trigger(); map.resize(); });
</script>
</body>
</html>
